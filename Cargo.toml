[package]
name = "gta-vi-countdown"
version = "0.1.0"
edition = "2024"
default-run = "gta-vi-countdown"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
hound = "3.5"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18.1"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm", "wav"] }
tempfile = "3"
thiserror = "2"

[build-dependencies]
slint-build = "1.18.1"
winres = "0.1.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "extract-audio"
path = "src/bin/extract_audio.rs"
